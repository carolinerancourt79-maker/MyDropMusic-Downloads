name: Build and publish Windows companion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['WindowsSync/**', 'scripts/test_sync_helper.py', 'scripts/test_sync_ui.py', '.github/workflows/windows-companion.yml']
permissions:
  contents: write
concurrency:
  group: windows-companion-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install pyinstaller qrcode cryptography
      - name: Test HTTPS transfers and GUI
        run: |
          python scripts/test_sync_helper.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_sync_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable executable
        working-directory: WindowsSync
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MyDropMusicSync MyDropMusicSync.py
      - name: Check executable starts
        shell: pwsh
        run: |
          $process = Start-Process WindowsSync/dist/MyDropMusicSync.exe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw 'Companion exited during startup' }
          Stop-Process -Id $process.Id
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler WindowsSync/MyDropMusicSync.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path WindowsSync/dist/MyDropMusicSync.exe,WindowsSync/README.txt -DestinationPath WindowsSync/dist/MyDropMusicSync_6_22_45.zip
          Get-FileHash WindowsSync/installer/MyDropMusicSync_Setup_6_22_45.exe,WindowsSync/dist/MyDropMusicSync_6_22_45.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content WindowsSync/dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MyDropMusicSync-6.22.45
          path: |
            WindowsSync/installer/*.exe
            WindowsSync/dist/*.zip
            WindowsSync/dist/SHA256SUMS.txt
      - name: Publish Windows companion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v6.22.45 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release v6.22.45 already exists; use a new version' }
          gh release create v6.22.45 WindowsSync/installer/MyDropMusicSync_Setup_6_22_45.exe WindowsSync/dist/MyDropMusicSync_6_22_45.zip WindowsSync/dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'MyDropMusic Sync Windows 6.22.45 — Transfert rapide' --notes-file WindowsSync/RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
